status:
  scope: >-
    The Alon–Tarsi theorem is proved for every finite simple graph with an orientation whose
    numbers of even and odd Eulerian subdigraphs differ, for lists larger than the out-degrees;
    the 3-choosability statement for every finite planar bipartite graph. Lists are over an
    arbitrary colour type.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan (graph
        polynomial and Nullstellensatz; bipartite Eulerian subdigraphs are even; sparsity of planar
        bipartite graphs from Euler's formula; Hakimi's lemma) on top of the existing planarity
        library; the return was audited (statements, definitions and headers unchanged, library
        unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging (planarity definitions reproduced verbatim), checked with `lake build`,
        `#print axioms` and a comparison of the elaborated Challenge and Solution declarations
        (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types and definitions for the Challenge/Solution pair).

fidelity:
  divergences: >-
    An orientation is a relation D on the vertices with every arc an edge, every edge oriented and
    no edge oriented both ways; Eulerian subdigraphs are subsets of the arc set (as pairs) with
    equal in- and out-degree at every vertex, counted by parity with classical decidability. The
    out-degree is the number of w with D v w. Planarity is the existence of a plane map (a rotation
    system on darts with Euler defect 0), shown in PALOMAR-2026-10-15-000005 to be equivalent to
    Wagner's minor characterization; bipartiteness is `Colorable 2`. Lists are finsets over an
    arbitrary colour type.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with the Alon–Tarsi theorem and its planar corollary, checked the
    definitions of orientations and Eulerian counts on small examples (cyclic and transitive
    orientations of a triangle), checked that the Aristotle return left the statements,
    definitions, headers and reused library unchanged, and confirmed by `lake build`,
    `#print axioms` and a comparison of the fully elaborated Challenge and Solution declarations
    that the proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The author
    directed the work and approved the statements. No independent human mathematical review has
    been performed. The results are classical; no mathematical novelty is claimed.

